name: Suppl
options:
  bundleIdPrefix: com.zgalbs
  deploymentTarget:
    iOS: "17.0"
packages:
  SupplCore:
    path: SupplCore
settings:
  base:
    DEVELOPMENT_TEAM: 8DGT7FKTPZ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Suppl:
    type: application
    platform: iOS
    sources:
      - path: Suppl
        excludes:
          - Info.plist
          - Suppl.entitlements
          - Resources/Products.storekit
      - path: Suppl/Resources/Products.storekit
        buildPhase: none
    configFiles:
      Debug: Config/Suppl.xcconfig
      Release: Config/Suppl.xcconfig
    dependencies:
      - package: SupplCore
    entitlements:
      path: Suppl/Suppl.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Suppl/Info.plist
      properties:
        # XcodeGen writes 1.0 / 1 into the file otherwise, which would override the settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.zgalbs.suppl
            CFBundleURLSchemes: [suppl]
        BGTaskSchedulerPermittedIdentifiers: [com.zgalbs.suppl.refresh]
        UIBackgroundModes: [fetch]
        WHOOPClientID: $(WHOOP_CLIENT_ID)
        WHOOPBrokerURL: $(WHOOP_BROKER_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zgalbs.suppl
        PRODUCT_NAME: suppl
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: suppl.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: "suppl. reads your workouts and sleep so it can remind you after a workout and shift morning reminders when you wake up late. Nothing leaves your phone."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "suppl. checks when you're busy so it can move a flexible reminder into a free moment. It never reads event titles, notes, or attendees."
    scheme:
      testTargets: [SupplTests]
      storeKitConfiguration: Suppl/Resources/Products.storekit
  SupplTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SupplTests]
    dependencies:
      # SupplCore is linked into the app; the hosted test bundle resolves it through the app binary.
      - target: Suppl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zgalbs.suppl.tests
        GENERATE_INFOPLIST_FILE: YES
